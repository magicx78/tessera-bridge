# What tools/preview.py shows: the sessions sensor as the tessera_claude integration writes it, and the answers of
# the integration's services, so the tile, the cards and the popup show real data (docs/PREVIEW.md).
tiles:
  - tile: overview
    name: Claude
    entity: sensor.claude_sessions
  - tile: overview
    name: Nothing running
    entity: sensor.claude_sessions_empty
    sizes: [1x1, 2x1]
  - tile: overview
    name: No sensor
    sizes: [1x1]
  - tile: activity
    entity: sensor.claude_sessions
    sizes: [1x1, 2x1, 2x2]
  - tile: activity
    name: At rest
    entity: sensor.claude_sessions_empty
    sizes: [1x1, 2x1]
  - tile: activity
    name: Mosaic at work
    entity: sensor.claude_sessions_work
    sizes: [1x1, 2x1]
  - tile: activity
    name: Muncher at work
    entity: sensor.claude_sessions_work
    options: { motion: chomper }
    sizes: [1x1, 2x1, 2x2]
  - tile: activity
    name: Muncher waits
    entity: sensor.claude_sessions_perm
    options: { motion: chomper }
    sizes: [2x1]
  - tile: activity
    name: Muncher asks
    entity: sensor.claude_sessions
    options: { motion: chomper }
    sizes: [2x1]
  - tile: activity
    name: Muncher sleeps
    entity: sensor.claude_sessions_empty
    options: { motion: chomper }
    sizes: [1x1, 2x1]
  - tile: activity
    name: Spark at work
    entity: sensor.claude_sessions_work
    options: { motion: spark }
    sizes: [1x1, 2x1, 2x2]
  - tile: activity
    name: Spark sleeps
    entity: sensor.claude_sessions_empty
    options: { motion: spark }
    sizes: [2x1]
  - tile: activity
    name: No motion
    entity: sensor.claude_sessions_work
    options: { motion: none }
    sizes: [1x1, 2x1]
  - tile: limits
    entity: sensor.claude_sessions
    sizes: [1x1, 2x1, 2x2, 3x2]
  - tile: limits
    name: Running hot
    entity: sensor.claude_sessions_work
    sizes: [1x1, 2x2]
  - tile: limits
    name: No sensor
    sizes: [1x1]
  - tile: limits
    name: Claude 5h
    entity: sensor.claude_sessions
    options: { window: five }
    sizes: [1x1, 2x1, 2x2]
  - tile: limits
    name: Claude week
    entity: sensor.claude_sessions_work
    options: { window: week }
    sizes: [1x1]
  - tile: background
    entity: sensor.claude_background
    sizes: [1x1, 2x1, 2x2, 3x3]
  - tile: background
    name: Nothing
    entity: sensor.claude_background_empty
    sizes: [1x1, 2x1]

states:
  sensor.claude_background:
    state: "4"
    attributes:
      bg_titles: ["Build the P4 firmware", "Review the registry change", "Watch the HA log", "Release checks"]
      bg_kinds: [shell, agent, monitor, workflow]
      bg_sess: [tessera-bridge, tessera-bridge, homelab-docs, garden-irrigation]
      bg_at: ["{epoch-3m}", "{epoch-12m}", "{epoch-47m}", "{epoch-5h}"]
      bg_hm: ["14:57", "14:48", "14:13", "10:00"]
      # Steps only where the task reports them (the mod 0.2.4): -1 and 0 while unknown.
      bg_done: [-1, 2, -1, 3]
      bg_total: [0, 5, 0, 4]
  sensor.claude_background_empty:
    state: "0"
    attributes:
      bg_titles: []
      bg_kinds: []
      bg_sess: []
      bg_at: []
      bg_hm: []
      bg_done: []
      bg_total: []
  sensor.claude_sessions:
    state: "3"
    attributes:
      rev: 41
      # No event here: a new question would open its popup over every picture of the tiles (the popup itself is
      # checked on the glass).
      event: ""
      event_rev: 3
      open: 2
      h: [sab3, sab5, sab1]
      names: [tessera-bridge, homelab-docs, garden-irrigation]
      states: [ask, perm, work]
      ctx: [37, 62, -1]
      asks: [2, 0, 0]
      q: [qab7, "", ""]
      active: 3
      active_since: "{epoch-12m}"
      last_active: "{epoch}"
      l5h: 44
      l5h_at: "{epoch+1h}"
      lwk: 12
      lwk_at: "{epoch+3d}"
      lx_names: [opus]
      lx: [8]
      notify: speech
  sensor.claude_sessions_work:
    state: "2"
    attributes:
      rev: 7
      event: ""
      open: 0
      h: [sab3, sab1]
      names: [tessera-bridge, garden-irrigation]
      states: [work, work]
      ctx: [37, 12]
      asks: [0, 0]
      q: ["", ""]
      active: 2
      active_since: "{epoch-12m}"
      last_active: "{epoch}"
      l5h: 78
      l5h_at: "{epoch+2h}"
      lwk: 91
      lwk_at: "{epoch+1d}"
      lx_names: [fable]
      lx: [64]
  sensor.claude_sessions_perm:
    state: "2"
    attributes:
      rev: 8
      event: ""
      open: 0
      h: [sab5, sab1]
      names: [homelab-docs, garden-irrigation]
      states: [perm, work]
      ctx: [62, 12]
      asks: [0, 0]
      q: ["", ""]
      active: 2
      active_since: "{epoch-4m}"
      last_active: "{epoch}"
      l5h: 44
      l5h_at: "{epoch+1h}"
      lwk: 12
      lwk_at: "{epoch+3d}"
      lx_names: []
      lx: []
  sensor.claude_sessions_empty:
    state: "0"
    attributes:
      rev: 1
      event: ""
      open: 0
      h: []
      names: []
      states: []
      ctx: []
      asks: []
      q: []
      active: 0
      active_since: 0
      last_active: "{epoch-1h}"
      l5h: -1
      l5h_at: 0
      lwk: -1
      lwk_at: 0
      lx_names: []
      lx: []

commands:
  "call_service:tessera_claude.get_overview":
    sessions:
      - { h: sab3, name: tessera-bridge, pc: workstation, state: ask, ctx: 37, asks: 2, q: qab7, detail: "" }
      - { h: sab5, name: homelab-docs, pc: workstation, state: perm, ctx: 62, asks: 0, q: "", detail: "Bash: rm -rf build" }
      - { h: sab1, name: garden-irrigation, pc: laptop, state: work, ctx: -1, asks: 0, q: "", detail: "" }
      - { h: sab8, name: openclaw, pc: laptop, state: idle, ctx: 5, asks: 0, q: "", detail: "" }
      - { h: sab9, name: solar-expansion, pc: laptop, state: lost, ctx: 80, asks: 0, q: "", detail: "" }
    limits:
      kinds:
        five_hour: { percent: 44, resets_at: "{now+1h}" }
        seven_day: { percent: 12, resets_at: "{now+3d}" }
  "call_service:tessera_claude.get_question":
    h: qab7
    rev: 41
    status: open
    session: sab3
    name: tessera-bridge
    parts:
      - id: p0
        header: Approach
        text: "Should the display plugin answer questions with several parts one part at a time?"
        lines: ["Should the display plugin answer questions", "with several parts one part at a time?"]
        multi: false
        options:
          - { id: o0, label: "One at a time", description: "Simplest on a small screen" }
          - { id: o1, label: "All on one page", description: "Needs a tall screen" }
          - { id: o2, label: "Ask on the PC", description: "" }
      - id: p1
        header: Modules
        text: "Which modules should the first version include?"
        lines: ["Which modules should the first version include?"]
        multi: true
        options:
          - { id: o0, label: "Tile", description: "" }
          - { id: o1, label: "Cards", description: "" }
          - { id: o2, label: "Popup", description: "" }
  "call_service:tessera_claude.get_hint":
    h: sab5
    name: homelab-docs
    state: perm
    detail: "Bash: rm -rf build"
  "call_service:tessera_claude.answer":
    accepted: true
  "call_service:tessera_claude.get_background":
    tasks:
      - { title: "Build the P4 firmware", kind: shell, session: tessera-bridge, at: "{epoch-3m}", hm: "14:57", done: -1, total: 0, note: "" }
      - { title: "Review the registry change", kind: agent, session: tessera-bridge, at: "{epoch-12m}", hm: "14:48", done: 2, total: 5, note: "Writing the tests" }
      - { title: "Watch the HA log", kind: monitor, session: homelab-docs, at: "{epoch-47m}", hm: "14:13", done: -1, total: 0, note: "" }
      - { title: "Release checks", kind: workflow, session: garden-irrigation, at: "{epoch-5h}", hm: "10:00", done: 3, total: 4, note: "" }
  "call_service:tessera_claude.set_notify":
    notify: tone

cards:
  - { card: sessions, entity: sensor.claude_sessions }
  - { card: background, entity: sensor.claude_background }
  - { card: question }
